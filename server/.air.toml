# The Go server with live reload, on this machine: from server/, `go tool -modfile=tools/go.mod air`
# (Procfile) rebuilds it, migrates, and restarts `rondo serve` on :23901 on every change, against
# compose.yaml's services (.env, then dev.env).
tmp_dir = "bin"
env_files = [".env", "dev.env"]

[build]
cmd = "go build -o bin/rondo ./cmd/rondo && bin/rondo migrate"
entrypoint = ["bin/rondo", "serve"]
include_ext = ["go", "sql"]
exclude_dir = ["bin", "api"]
exclude_regex = ["_test\\.go$"]
# A signal lets requests in flight finish before the next build replaces the server.
send_interrupt = true
kill_delay = "3s"
stop_on_error = true
