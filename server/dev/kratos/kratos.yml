# Ory Kratos for local development. Production overrides URLs and secrets in ops (apps/rondo).
# Sign-in is passwordless: email codes, passkeys, and Google/Apple (oidc.yml, where credentials exist).
# An authenticator app (TOTP) with recovery codes is an optional second step; once someone turns it
# on, sessions need it (highest_available) everywhere, settings included.
serve:
  public:
    # The web app's dev server proxies /auth here (vite.config.ts), as Traefik does in production.
    base_url: http://localhost:23900/auth/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:23900/app/
  allowed_return_urls: [http://localhost:23900]
  methods:
    code: { enabled: true, passwordless_enabled: true, config: { lifespan: 15m } }
    passkey:
      enabled: true
      config: { rp: { display_name: Rondo, id: localhost, origins: [http://localhost:23900] } }
    totp: { enabled: true, config: { issuer: Rondo } }
    lookup_secret: { enabled: true }
    password: { enabled: false }
    link: { enabled: false }
  flows:
    error: { ui_url: http://localhost:23900/app/sign-in }
    login: { ui_url: http://localhost:23900/app/sign-in, lifespan: 30m }
    registration:
      ui_url: http://localhost:23900/app/sign-in
      lifespan: 30m
      after:
        code: { hooks: [{ hook: web_hook, config: &registered { url: http://host.docker.internal:23901/api/hooks/kratos/registration, method: POST, body: "base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5X2lkOiBjdHguaWRlbnRpdHkuaWQgfQ==", response: { ignore: true }, auth: &auth { type: api_key, config: { name: Authorization, value: dev-hook-secret, in: header } } } }, { hook: session }] }
        passkey: { hooks: [{ hook: web_hook, config: *registered }, { hook: session }] }
        oidc: { hooks: [{ hook: web_hook, config: *registered }, { hook: session }] }
    settings: { ui_url: http://localhost:23900/app/settings, privileged_session_max_age: 10m, required_aal: highest_available }
    verification: { enabled: true, use: code, ui_url: http://localhost:23900/app/sign-in }
    recovery: { enabled: false }

session:
  lifespan: 2160h
  earliest_possible_extend: 720h
  whoami: { required_aal: highest_available }

identity:
  default_schema_id: user
  schemas: [{ id: user, url: file:///etc/kratos/identity.schema.json }]

courier:
  delivery_strategy: http
  http:
    request_config:
      url: http://host.docker.internal:23901/api/hooks/kratos/courier
      method: POST
      body: file:///etc/kratos/courier.jsonnet
      auth: *auth

ciphers: { algorithm: xchacha20-poly1305 }
log: { level: info, format: text }
