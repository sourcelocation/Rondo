# Rondo's services, in one file that needs nothing beside it but .env (copy .env.example):
#   docker compose up -d --wait     what Rondo depends on: Postgres, Kratos, Hydra (and Mailpit, by
#                                   .env.example's profiles). In development Rondo's own servers run
#                                   on this machine, each reloading itself (Procfile).
#   COMPOSE_PROFILES=app            Rondo itself as well, from the release this file comes with, as
#                                   self-hosting runs it; `--build` builds this checkout instead.
# Rondo is at RONDO_PUBLIC_URL, http://localhost:23900/app/ unless you change it. HTTPS is a reverse
# proxy's job, in front of port 23900 (the docs' "Run your own server").
#
# Rondo's ports are 23900-23912, so it runs beside other projects' stacks:
#   23900 the front door (`proxy`, or Vite in development)   23901 Go server   23902 sync server
#   23903 Postgres   23904 Kratos (admin 23905)   23906 Hydra (admin 23907)   23908 Mailpit (SMTP 23909)
#   23910 S3   23911 landing   23912 docs
# Inside the network every service keeps its usual port.
name: rondo

x-postgres: &postgres
  depends_on: { postgres: { condition: service_healthy } }
x-database: &database "postgres://rondo:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/rondo?sslmode=disable"
x-kratos-database: &kratos-database "postgres://rondo:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable"
x-hydra-database: &hydra-database "postgres://rondo:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable"
# The release every image comes from; release-please keeps it.
x-api-image: &api-image ghcr.io/sourcelocation/rondo-api:v0.1.9 # x-release-please-version
x-sync-image: &sync-image ghcr.io/sourcelocation/rondo-sync:v0.1.9 # x-release-please-version
x-web-image: &web-image ghcr.io/sourcelocation/rondo-web:v0.1.9 # x-release-please-version

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment: { POSTGRES_USER: rondo, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: rondo }
    configs: [{ source: databases, target: /docker-entrypoint-initdb.d/databases.sql }]
    volumes: ["database:/var/lib/postgresql"]
    ports: ["127.0.0.1:23903:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rondo"], interval: 2s, retries: 30 }

  kratos-migrate:
    <<: *postgres
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment: { DSN: *kratos-database }

  # RONDO_PLAIN_HTTP (as on this machine) puts Kratos and Hydra in Ory's dev mode: Hydra refuses an
  # http:// issuer without it, and both mark their cookies Secure.
  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    command: serve -c /etc/kratos/kratos.yml --watch-courier --sqa-opt-out
    environment:
      DSN: *kratos-database
      DEV: ${RONDO_PLAIN_HTTP:-false}
      SECRETS_COOKIE: "${KRATOS_COOKIE_SECRET:?set it in .env}"
      SECRETS_CIPHER: "${KRATOS_CIPHER_SECRET:?set it in .env}"
    configs:
      - { source: kratos, target: /etc/kratos/kratos.yml }
      - { source: kratos-schema, target: /etc/kratos/identity.schema.json }
      - { source: kratos-courier, target: /etc/kratos/courier.jsonnet }
    ports: ["127.0.0.1:23904:4433", "127.0.0.1:23905:4434"]
    # In development its hooks reach the Go server on this machine there (RONDO_API_URL).
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4433/health/ready"], interval: 2s, retries: 30 }
    depends_on: { kratos-migrate: { condition: service_completed_successfully } }

  hydra-migrate:
    <<: *postgres
    image: oryd/hydra:v26.2.0
    command: migrate sql up -e --yes
    environment: { DSN: *hydra-database }

  hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    command: serve all -c /etc/hydra/hydra.yml --sqa-opt-out
    environment:
      DSN: *hydra-database
      DEV: ${RONDO_PLAIN_HTTP:-false}
      SECRETS_SYSTEM: "${HYDRA_SYSTEM_SECRET:?set it in .env}"
    configs: [{ source: hydra, target: /etc/hydra/hydra.yml }]
    ports: ["127.0.0.1:23906:4444", "127.0.0.1:23907:4445"]
    healthcheck: { test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4444/health/ready"], interval: 2s, retries: 30 }
    depends_on: { hydra-migrate: { condition: service_completed_successfully } }

  # Rondo itself (the app profile): the Go server, migrating first, the sync server, and the web app.
  migrate:
    <<: *postgres
    profiles: [app]
    image: *api-image
    pull_policy: never # `api` pulls or builds the image
    command: migrate
    environment: { RONDO_DATABASE_URL: *database }

  api:
    profiles: [app]
    image: *api-image
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    command: serve
    env_file: .env
    environment:
      RONDO_DATABASE_URL: *database
      RONDO_KRATOS_PUBLIC_URL: http://kratos:4433
      RONDO_KRATOS_ADMIN_URL: http://kratos:4434
      RONDO_HYDRA_ADMIN_URL: http://hydra:4445
      RONDO_SMTP_HOST: ${RONDO_SMTP_HOST:-mail}
      RONDO_SMTP_PORT: ${RONDO_SMTP_PORT:-1025}
      # The image runs as "nonroot", whose home the volume takes over (and its owner with it).
      RONDO_MEDIA_DIR: /home/nonroot/media
    volumes: ["media:/home/nonroot"]
    ports: ["127.0.0.1:23901:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  sync:
    profiles: [app]
    image: *sync-image
    build: { context: .., dockerfile: app/Dockerfile, target: sync }
    restart: unless-stopped
    environment:
      RONDO_DATABASE_URL: *database
      RONDO_PUBLIC_URL: "${RONDO_PUBLIC_URL:?set it in .env}"
      RONDO_KRATOS_PUBLIC_URL: http://kratos:4433
      RONDO_HYDRA_ADMIN_URL: http://hydra:4445
    ports: ["127.0.0.1:23902:8081"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The web app's files, under /app (app/platforms/web/Caddyfile).
  web:
    profiles: [app]
    image: *web-image
    build: { context: .., dockerfile: app/Dockerfile, target: web }
    restart: unless-stopped

  # The front door, routing by path as production's ingress does (and Vite in development): the web
  # app, the Go server, the sync server, Kratos and Hydra.
  proxy:
    profiles: [app]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    configs: [{ source: proxy, target: /etc/caddy/Caddyfile }]
    ports: ["127.0.0.1:23900:8080"]
    depends_on: [web, api, sync, kratos, hydra]

  # The mail profile (as in .env.example): sign-in codes land in Mailpit, at http://localhost:23908.
  mail:
    profiles: [mail]
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:23908:8025", "127.0.0.1:23909:1025"]

  # The s3 profile: S3-compatible storage in place of the media volume.
  storage:
    profiles: [s3]
    image: rustfs/rustfs:1.0.3
    environment: { RUSTFS_ACCESS_KEY: rondo, RUSTFS_SECRET_KEY: rondo-dev-secret }
    volumes: ["storage:/data"]
    ports: ["127.0.0.1:23910:9000"]

volumes:
  database: {}
  media: {}
  storage: {}

configs:
  # The front door's routes (the proxy service). Kratos's paths lose their /auth prefix, and the
  # Origin and Cookie headers browsers add: the apps' sign-in is headless.
  proxy:
    content: |
      :8080 {
        encode zstd gzip

        redir / /app/

        @web path /app /app/*
        handle @web {
          reverse_proxy web:8080
        }
        @api path /api/* /media/* /blobs/*
        handle @api {
          reverse_proxy api:8080
        }
        @sync path /sync/* /mcp /.well-known/oauth-protected-resource*
        handle @sync {
          reverse_proxy sync:8081
        }
        handle_path /auth/* {
          reverse_proxy kratos:4433 {
            header_up -Origin
            header_up -Cookie
          }
        }
        @hydra path /oauth2/* /userinfo /.well-known/openid-configuration /.well-known/oauth-authorization-server /.well-known/jwks.json
        handle @hydra {
          reverse_proxy hydra:4444
        }
        handle {
          respond 404
        }
      }

  # Kratos and Hydra keep their own databases beside Rondo's; the tests (`go test`, Gradle's
  # :sync:test) theirs.
  databases:
    content: |
      CREATE DATABASE kratos;
      CREATE DATABASE hydra;
      CREATE DATABASE rondo_test;
      CREATE DATABASE rondo_test_go;

  # Kratos signs people in: email codes and passkeys, with an authenticator app as an optional
  # second step; once someone turns it on, sessions need it (highest_available) everywhere, settings
  # included. It tells the Go server about each new account and hands it the mail to send. Production
  # has its own copy (ops: apps/rondo/config.yaml).
  kratos:
    content: |
      serve:
        public: { base_url: "${RONDO_PUBLIC_URL}/auth/" }
        admin: { base_url: "http://kratos:4434/" }
      selfservice:
        default_browser_return_url: "${RONDO_PUBLIC_URL}/app/"
        allowed_return_urls: ["${RONDO_PUBLIC_URL}"]
        methods:
          code: { enabled: true, passwordless_enabled: true, config: { lifespan: 15m } }
          passkey:
            enabled: true
            config: { rp: { display_name: Rondo, id: "${RONDO_HOST}", origins: ["${RONDO_PUBLIC_URL}"] } }
          totp: { enabled: true, config: { issuer: Rondo } }
          lookup_secret: { enabled: true }
          password: { enabled: false }
          link: { enabled: false }
        flows:
          error: { ui_url: "${RONDO_PUBLIC_URL}/app/sign-in" }
          login: { ui_url: "${RONDO_PUBLIC_URL}/app/sign-in", lifespan: 30m }
          registration:
            ui_url: "${RONDO_PUBLIC_URL}/app/sign-in"
            lifespan: 30m
            after:
              code: { hooks: [{ hook: web_hook, config: &registered { url: "${RONDO_API_URL:-http://api:8080}/api/hooks/kratos/registration", method: POST, body: "base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5X2lkOiBjdHguaWRlbnRpdHkuaWQgfQ==", response: { ignore: true }, auth: &auth { type: api_key, config: { name: Authorization, value: "${RONDO_HOOK_SECRET:?set it in .env}", in: header } } } }, { hook: session }] }
              passkey: { hooks: [{ hook: web_hook, config: *registered }, { hook: session }] }
              oidc: { hooks: [{ hook: web_hook, config: *registered }, { hook: session }] }
          settings: { ui_url: "${RONDO_PUBLIC_URL}/app/settings", privileged_session_max_age: 10m, required_aal: highest_available }
          verification: { enabled: true, use: code, ui_url: "${RONDO_PUBLIC_URL}/app/sign-in" }
          recovery: { enabled: false }
      session:
        lifespan: 2160h
        earliest_possible_extend: 720h
        whoami: { required_aal: highest_available }
      identity:
        default_schema_id: user
        schemas: [{ id: user, url: "file:///etc/kratos/identity.schema.json" }]
      courier:
        delivery_strategy: http
        http:
          request_config:
            url: "${RONDO_API_URL:-http://api:8080}/api/hooks/kratos/courier"
            method: POST
            body: "file:///etc/kratos/courier.jsonnet"
            auth: *auth
      ciphers: { algorithm: xchacha20-poly1305 }
      log: { level: info, format: json }
  # Who someone is to Kratos: an email address.
  kratos-schema:
    content: |
      {
        "$$id": "https://rondo.matthewsource.com/schemas/user.json",
        "$$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Rondo user",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "maxLength": 254,
                "ory.sh/kratos": {
                  "credentials": { "code": { "identifier": true, "via": "email" }, "passkey": { "display_name": true } },
                  "verification": { "via": "email" }
                }
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }
  kratos-courier:
    content: |
      // Kratos's messages as Rondo's mail sender takes them: it renders them with Rondo's own templates.
      local data(ctx) = if 'template_data' in ctx && ctx.template_data != null then ctx.template_data else {};
      local first(d, keys) = std.foldl(function(found, k) if found != '' then found else std.toString(std.get(d, k, '')), keys, '');

      function(ctx) {
        template_type: ctx.template_type,
        recipient: ctx.recipient,
        code: first(data(ctx), ['login_code', 'registration_code', 'verification_code', 'recovery_code']),
        url: first(data(ctx), ['verification_url', 'recovery_url']),
      }

  # Hydra is the OAuth server AI assistants sign in through, to reach /mcp. The web app handles its
  # login step (for whoever is signed in there) and asks for consent.
  hydra:
    content: |
      serve:
        public: { cors: { enabled: true, allowed_origins: ["*"] } }
      urls:
        self: { issuer: "${RONDO_PUBLIC_URL}/" }
        login: "${RONDO_PUBLIC_URL}/app/sign-in"
        consent: "${RONDO_PUBLIC_URL}/app/oauth/consent"
        error: "${RONDO_PUBLIC_URL}/app/oauth/consent"
      oidc:
        dynamic_client_registration:
          enabled: true
          # Everything discovery lists, so a client that asks for all of it isn't refused.
          default_scope: [openid, offline, offline_access, rondo]
      # Agents find /oauth2/register only through discovery: Hydra leaves it out unless named here.
      webfinger:
        oidc_discovery:
          client_registration_url: "${RONDO_PUBLIC_URL}/oauth2/register"
          supported_scope: [rondo]
      strategies:
        access_token: opaque
      ttl:
        access_token: 1h
        refresh_token: 2160h
      log: { level: info, format: json }
