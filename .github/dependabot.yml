version: 2

updates:
  - package-ecosystem: gomod
    directories: [/server, /server/tools]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      go: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      npm: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "@js-joda/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directory: /app
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      kotlin: { patterns: ["org.jetbrains.kotlin*"] }
      gradle: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/app, /server, /site/landing, /site/docs]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      docker: { update-types: [minor, patch] }
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: golang
      - dependency-name: node

  - package-ecosystem: docker-compose
    directory: /server
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      compose: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "ghcr.io/sourcelocation/*"

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      actions: { update-types: [minor, patch] }
