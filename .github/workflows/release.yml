name: Release

# A release is a pull request from master into production, titled with the version it ships (v1.2.3).
# On the pull request, the images are built and pushed as candidates (<version>-<commit>), and
# "Release candidate" passes once all of them exist. Merging it promotes the candidates to <version>,
# tags the merge commit and asks ops to deploy. A build that fails blocks the merge, so no version is
# used up by a broken release.
on:
  pull_request:
    branches: [production]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  # A body-only edit gets a group of its own, so it never cancels a build.
  group: >-
    release-${{ github.event.pull_request.number || 'production' }}${{
    github.event.action == 'edited' && !github.event.changes.title && '-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGES: api sync web site

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      candidate: ${{ steps.version.outputs.candidate }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REBUILD: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.title != null) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr=$(jq '.pull_request' "$GITHUB_EVENT_PATH")
          else
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.base.ref == \"production\" and .merged_at != null)][0]")
          fi
          if [ -z "$pr" ] || [ "$pr" = null ]; then
            echo "::error::production only changes through a release pull request."; exit 1
          fi
          tag=$(jq -r '.title' <<<"$pr")
          sha=$(jq -r '.head.sha' <<<"$pr")
          from=$(jq -r '.head.repo.full_name + ":" + .head.ref' <<<"$pr")
          if [ "$from" != "$GITHUB_REPOSITORY:$DEFAULT_BRANCH" ]; then
            echo "::error::A release comes from $DEFAULT_BRANCH, not $from."; exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The title is the version it releases, like v1.2.3, not \"$tag\"."; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::$tag is released already."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The release builds what master's CI tested: wait for it on this commit.
            for _ in $(seq 1 120); do
              run=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json status,conclusion --jq '.[0] // empty')
              [ -z "$run" ] || [ "$(jq -r .status <<<"$run")" = completed ] && break
              sleep 15
            done
            if [ -n "$run" ] && [ "$(jq -r .conclusion <<<"$run")" != success ]; then
              echo "::error::CI didn't pass on master at ${sha:0:7}."; exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "candidate=$tag-${sha:0:7}"
            echo "build=$REBUILD"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.image }}
    if: needs.version.outputs.build == 'true'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, file: server/Dockerfile, target: "" }
          - { image: sync, file: app/Dockerfile, target: sync }
          - { image: web, file: app/Dockerfile, target: web }
          - { image: site, file: site/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rondo-${{ matrix.image }}:${{ needs.version.outputs.candidate }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            RELEASE=${{ needs.version.outputs.tag }}
            SENTRY_DSN=${{ vars.WEB_SENTRY_DSN }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rondo-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rondo-${{ matrix.image }}:buildcache,mode=max

  candidate:
    name: Release candidate
    if: always() && github.event_name == 'pull_request'
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4.6.0
        if: needs.version.result == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Passes once every candidate image exists: built by this run, or, after a body-only edit, by
      # the run still building them.
      - env:
          VERSION_RESULT: ${{ needs.version.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$VERSION_RESULT" = success ] || { echo "::error::The release version isn't valid."; exit 1; }
          [ "$IMAGES_RESULT" = success ] || [ "$IMAGES_RESULT" = skipped ] || { echo "::error::An image failed to build."; exit 1; }
          for image in $IMAGES; do
            ref="ghcr.io/$OWNER/rondo-$image:$CANDIDATE"
            for _ in $(seq 1 60); do docker buildx imagetools inspect "$ref" >/dev/null 2>&1 && continue 2; sleep 15; done
            echo "::error::$ref doesn't exist."; exit 1
          done

  promote:
    name: Promote
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The candidates become the release
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            docker buildx imagetools create -t "ghcr.io/$OWNER/rondo-$image:$TAG" "ghcr.io/$OWNER/rondo-$image:$CANDIDATE"
          done
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent

  deploy:
    name: Deploy through ops
    needs: [version, promote]
    runs-on: ubuntu-latest
    # Only production may deploy, and the token that writes to ops lives in this environment.
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ops
          token: ${{ secrets.OPS_TOKEN }}
      # As GeoDuels does: only the image tags change, and a race with another app's deploy rebases.
      - name: Point apps/rondo at the new images
        env:
          TAG: ${{ needs.version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in $IMAGES; do
            yq -i "(.images[] | select(.name == \"ghcr.io/$OWNER/rondo-$image\") | .newTag) = \"$TAG\"" apps/rondo/kustomization.yaml
          done
          git config user.name "rondo-release"
          git config user.email "rondo-release@users.noreply.github.com"
          git commit -am "deploy rondo $TAG"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
