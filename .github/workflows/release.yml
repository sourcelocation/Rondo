name: Release

# See sourcelocation/.github's AGENTS.md.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: sourcelocation/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    with:
      app: rondo
      images: >-
        [
          {"image": "api", "file": "server/Dockerfile"},
          {"image": "sync", "file": "app/Dockerfile", "target": "sync"},
          {"image": "web", "file": "app/Dockerfile", "target": "web"},
          {"image": "site", "file": "site/Dockerfile"}
        ]
    secrets: inherit
