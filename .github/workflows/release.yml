name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  images:
    name: Images
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7.4.0
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          REVISION: ${{ needs.release-please.outputs.sha }}
          SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          WRITE_CACHE: "true"
        with:
          source: .
          push: true

  publish:
    name: Publish
    needs: [release-please, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  deploy:
    name: Deploy through ops
    needs: [release-please, images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ops
          token: ${{ secrets.OPS_TOKEN }}
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          yq -i '(.images[] | select(.name | test("^ghcr.io/sourcelocation/rondo-")) | .newTag) = strenv(TAG)' apps/rondo/kustomization.yaml
          git config user.name "rondo-release"
          git config user.email "rondo-release@users.noreply.github.com"
          git commit -am "deploy rondo $TAG" -m "From $GITHUB_REPOSITORY@$SHA"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
