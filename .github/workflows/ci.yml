name: CI

# Release pull requests into production carry master's latest commit, which this already tested.
on:
  push:
    branches: [master]
  pull_request:
    branches-ignore: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rondo, POSTGRES_PASSWORD: rondo, POSTGRES_DB: rondo_test_go }
        ports: ["23903:5432"]
        options: --health-cmd "pg_isready -U rondo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: server
      - name: Generated API code is current
        run: |
          go generate ./...
          git diff --exit-code -- .
      - uses: sqlc-dev/setup-sqlc@v5.0.0
        with:
          sqlc-version: "1.30.0"
      - name: Generated queries are current
        working-directory: server/db
        run: sqlc diff
      - name: Tests
        run: go test -race ./...

  app:
    name: Kotlin and web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rondo, POSTGRES_PASSWORD: rondo, POSTGRES_DB: rondo_test }
        ports: ["23903:5432"]
        options: --health-cmd "pg_isready -U rondo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.4.0
      # Rules and models (JVM and JS), the client against SQLite, the sync server against Postgres and
      # real clients, then the web app's copy of the client.
      - name: Format, tests, builds
        run: >-
          ./gradlew spotlessCheck :core:allTests :client:jvmTest :sync:test :cli:installDist
          :client:jsBrowserProductionLibraryDistribution
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: app/platforms/web/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: app/platforms/web/.node-version
          cache: pnpm
          cache-dependency-path: app/platforms/web/pnpm-lock.yaml
      - name: Web app
        working-directory: app/platforms/web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          pnpm build
