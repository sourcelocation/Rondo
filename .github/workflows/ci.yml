name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # What a change touches decides what runs. A skipped job passes as a required check; if this job
  # fails, the checks run anyway.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.checks.outputs.server }}
      app: ${{ steps.checks.outputs.app }}
      # The release pull request is what's about to ship, so it builds every image.
      images: >-
        ${{ startsWith(github.head_ref, 'release-please--') && '["api","sync","web","site"]'
        || steps.images.outputs.changes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: checks
        uses: dorny/paths-filter@v4.0.3
        with:
          # The brand reaches the app only through dist/ and fonts/, which the Brand workflow keeps
          # current with its sources.
          filters: |
            server:
              - .github/workflows/ci.yml
              - server/**
            app:
              - .github/workflows/ci.yml
              - app/**
              - server/api/**
              - brand/dist/**
              - brand/fonts/**
      # What an image is built with that the checks don't compile: its Dockerfile, the lockfile and
      # toolchain inside it, its server's config.
      - id: images
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            api:
              - .github/workflows/ci.yml
              - .dockerignore
              - server/Dockerfile
              - server/go.mod
              - server/go.sum
            sync:
              - .github/workflows/ci.yml
              - .dockerignore
              - app/Dockerfile
              - app/gradle/libs.versions.toml
              - app/gradle/wrapper/gradle-wrapper.properties
            web:
              - .github/workflows/ci.yml
              - .dockerignore
              - app/Dockerfile
              - app/gradle/libs.versions.toml
              - app/gradle/wrapper/gradle-wrapper.properties
              - app/platforms/web/Caddyfile
              - app/platforms/web/package.json
              - app/platforms/web/pnpm-lock.yaml
              - app/platforms/web/pnpm-workspace.yaml
            site:
              - .github/workflows/ci.yml
              - .dockerignore
              - site/Dockerfile
              - site/Caddyfile
              - site/package.json
              - site/pnpm-lock.yaml
              - site/pnpm-workspace.yaml

  server:
    name: Go server
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_USER: rondo, POSTGRES_PASSWORD: rondo, POSTGRES_DB: rondo_test_go }
        ports: ["23903:5432"]
        options: --health-cmd "pg_isready -U rondo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      # The latest Go, as the server's image builds with (server/Dockerfile), and a linter that knows it.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          working-directory: server
      - name: Generated API code is current
        run: |
          go generate ./...
          git diff --exit-code -- .
      - uses: sqlc-dev/setup-sqlc@v5.0.0
        with:
          sqlc-version: "1.30.0"
      - name: Generated queries are current
        working-directory: server/db
        run: sqlc diff
      - name: Tests
        run: go test -race ./...

  app:
    name: Kotlin and web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_USER: rondo, POSTGRES_PASSWORD: rondo, POSTGRES_DB: rondo_test }
        ports: ["23903:5432"]
        options: --health-cmd "pg_isready -U rondo" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.4.0
      # Rules and models (JVM and JS), the client against SQLite, the sync server against Postgres and
      # real clients, then the web app's copy of the client.
      - name: Format, tests, builds
        run: >-
          ./gradlew spotlessCheck :core:allTests :client:jvmTest :sync:test :cli:installDist
          :client:jsBrowserProductionLibraryDistribution
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: app/platforms/web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: app/platforms/web/.node-version
          cache: pnpm
          cache-dependency-path: app/platforms/web/pnpm-lock.yaml
      - name: Web app
        working-directory: app/platforms/web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          pnpm build

  # Builds the images without pushing them, so a broken build shows up before a release. Pull requests
  # only: master is what a pull request already built, and releases build the real images.
  images:
    name: Image ${{ matrix.image }}
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same images release.yml lists. Reads the cache release builds write; the release pull
      # request writes it too, so the release build after it reuses everything but the version.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: >-
            ${{ matrix.image == 'api' && 'server/Dockerfile' || matrix.image == 'site' && 'site/Dockerfile'
            || 'app/Dockerfile' }}
          target: ${{ (matrix.image == 'sync' || matrix.image == 'web') && matrix.image || '' }}
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rondo-${{ matrix.image }}:buildcache
          cache-to: >-
            ${{ startsWith(github.head_ref, 'release-please--') && format(
            'type=registry,ref=ghcr.io/{0}/rondo-{1}:buildcache,mode=max', github.repository_owner, matrix.image)
            || '' }}
