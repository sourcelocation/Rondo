# The sync server with live reload, on this machine beside the web app's Gradle build: from app/, Air
# (a tool of server/tools/go.mod; Procfile) rebuilds :sync (and the :core and :mcp it uses) through the Gradle
# daemon on every change and restarts it on :23902, against server/compose.yaml's services (sync/dev.env).
tmp_dir = "sync/build/air"
env_files = ["sync/dev.env"]

[build]
cmd = "./gradlew --quiet :sync:installDist"
entrypoint = ["sync/build/install/sync/bin/sync"]
include_dir = ["core/src/commonMain", "core/src/jvmMain", "mcp/src/main", "sync/src/main"]
include_ext = ["kt", "xml"]
include_file = ["core/build.gradle.kts", "mcp/build.gradle.kts", "sync/build.gradle.kts"]
send_interrupt = true
kill_delay = "3s"
stop_on_error = true
